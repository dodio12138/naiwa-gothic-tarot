<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>封面合成</title>
<!-- 用网站同款字体与素材合成 B 站 Toy 封面（1200×900）和方形图标（512×512）。
     用法：npm run dev 后打开 /assets-src/cover/cover.html；画好后调用 window.exportAll(url) 把图片 POST 出去 -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #222; color: #ccc; font: 13px sans-serif; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; align-items: flex-start; }
  canvas { box-shadow: 0 0 0 1px #555; max-width: 100%; }
  #cover { width: 600px; } #icon { width: 256px; }
</style>
</head>
<body>
<canvas id="cover" width="1200" height="900"></canvas>
<canvas id="icon" width="512" height="512"></canvas>
<script type="module">
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const GOLD = ['#fff1cf', '#f2c77e', '#c88a45', '#7a4216'];

async function drawCover() {
  const cv = document.getElementById('cover');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const [star, frame, divider, ...arts] = await Promise.all([
    load('/public/ui/starchart.webp'), load('/public/ui/frame.webp'), load('/public/ui/divider.webp'),
    load('/public/cards/art-full/18.webp'), load('/public/cards/art-full/21.webp'), load('/public/cards/art-full/17.webp'),
  ]);

  // 背景：酒红到墨黑的径向渐变 + 星图
  const bg = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H * 0.5, W * 0.75);
  bg.addColorStop(0, '#3a1a2a'); bg.addColorStop(0.55, '#170d13'); bg.addColorStop(1, '#0a0709');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'screen';
  const S = 1180; ctx.drawImage(star, (W - S) / 2, H * 0.36 - S / 2, S, S);
  ctx.restore();
  // 金色微尘
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = Math.random() * 1.6 + 0.3;
    ctx.fillStyle = `hsla(${Math.random() < 0.2 ? 52 : 40}, 80%, 70%, ${Math.random() * 0.5 + 0.1})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // 三张牌：左右倾斜、中间最大
  const card = (img, cx, cy, w, rot, glow) => {
    const h = w * 1.5;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.shadowColor = glow ? 'rgba(246,217,79,.35)' : 'rgba(0,0,0,.75)'; ctx.shadowBlur = glow ? 60 : 40; ctx.shadowOffsetY = glow ? 0 : 18;
    ctx.fillStyle = '#0c0809'; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.shadowColor = 'transparent';
    ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
    const s = 1.04; ctx.drawImage(img, -w * s / 2, -h * s / 2, w * s, h * s); ctx.restore();
    ctx.drawImage(frame, -w / 2, -h / 2, w, h);
    ctx.restore();
  };
  const cy = 300;
  card(arts[0], W / 2 - 250, cy + 26, 230, -0.16, false);
  card(arts[2], W / 2 + 250, cy + 26, 230, 0.16, false);
  card(arts[1], W / 2, cy, 270, 0, true);

  // 底部压暗，给标题留出清楚的底
  const fade = ctx.createLinearGradient(0, H * 0.55, 0, H);
  fade.addColorStop(0, 'rgba(10,7,9,0)'); fade.addColorStop(0.45, 'rgba(10,7,9,.88)'); fade.addColorStop(1, 'rgba(10,7,9,.96)');
  ctx.fillStyle = fade; ctx.fillRect(0, H * 0.55, W, H * 0.45);

  // 标题
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 20px Cinzel'; ctx.fillStyle = '#c88a45';
  ctx.letterSpacing = '12px';
  ctx.fillText('NAIWA · GOTHIC · TAROT', W / 2 + 6, 668);
  ctx.letterSpacing = '0px';
  const big = '暗夜塔罗', small = '奶蛙';
  ctx.font = '900 112px "Noto Serif SC"';
  const bw = ctx.measureText(big).width + 3 * 14;
  ctx.font = '900 54px "Noto Serif SC"';
  const sw = ctx.measureText(small).width + 1 * 6;
  const gap = 34, total = sw + gap + bw, x0 = W / 2 - total / 2, base = 800;
  // 小字「奶蛙」：奶蛙黄
  ctx.textAlign = 'left';
  ctx.letterSpacing = '6px';
  ctx.shadowColor = 'rgba(246,217,79,.45)'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#f6d94f'; ctx.fillText(small, x0, base - 44);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#c88a45'; ctx.font = '900 40px "Noto Serif SC"'; ctx.fillText('·', x0 + sw + 2, base - 50);
  // 大字「暗夜塔罗」：古金渐变
  ctx.font = '900 112px "Noto Serif SC"'; ctx.letterSpacing = '14px';
  const g = ctx.createLinearGradient(0, base - 100, 0, base + 10);
  GOLD.forEach((c, i) => g.addColorStop([0, 0.32, 0.62, 1][i], c));
  ctx.shadowColor = 'rgba(200,138,69,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 4;
  ctx.fillStyle = g; ctx.fillText(big, x0 + sw + gap, base);
  ctx.shadowColor = 'transparent'; ctx.letterSpacing = '0px';
  // 分隔花纹
  const dw = 520, dh = dw * divider.height / divider.width;
  ctx.drawImage(divider, W / 2 - dw / 2, 828, dw, dh);
}

async function drawIcon() {
  const cv = document.getElementById('icon');
  const ctx = cv.getContext('2d');
  const W = cv.width;
  const back = await load('/assets-src/card_back_original.png');
  const bg = ctx.createRadialGradient(W / 2, W / 2, 20, W / 2, W / 2, W * 0.72);
  bg.addColorStop(0, '#2a1420'); bg.addColorStop(1, '#0a0709');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, W);
  // 取牌背中央的奶蛋徽章
  const cw = 640, sx = (back.width - cw) / 2, sy = back.height / 2 - cw / 2;
  ctx.drawImage(back, sx, sy, cw, cw, 0, 0, W, W);
}

await document.fonts.load('900 112px "Noto Serif SC"', '奶蛙暗夜塔罗·');
await document.fonts.load('600 20px Cinzel', 'NAIWA');
await Promise.all([drawCover(), drawIcon()]);
window.coverReady = true;

window.exportAll = async (url) => {
  const post = (name, data) => fetch(`${url}/${name}`, { method: 'POST', body: data }).then((r) => r.text());
  return {
    cover: await post('toy-cover.jpg', document.getElementById('cover').toDataURL('image/jpeg', 0.92)),
    icon: await post('toy-icon.png', document.getElementById('icon').toDataURL('image/png')),
  };
};
</script>
</body>
</html>
