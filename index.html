<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d090c" />
  <title>奶蛙的暗黑命运 · Naiwa Gothic Tarot</title>
  <meta name="description" content="一只始终面无表情的黄色梨形怪物，穿行于庄严、阴郁、华丽的哥特塔罗世界。" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="奶蛙的暗黑命运 · Naiwa Gothic Tarot" />
  <meta property="og:description" content="一只始终面无表情的黄色梨形怪物，穿行于庄严、阴郁、华丽的哥特塔罗世界。抽一张牌，看看命运怎么说。" />
  <meta property="og:image" content="https://dodio12138.github.io/naiwa-gothic-tarot/og.jpg" />
  <meta property="og:url" content="https://dodio12138.github.io/naiwa-gothic-tarot/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="sigil" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud">
    <button class="brand" id="brand" type="button" aria-label="回到首页">
      <img src="/back-icon.webp" alt="" /><span>NAIWA · TAROT</span>
    </button>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="hud-actions">
      <button class="plate sm" id="skip" type="button" hidden>跳过 ››</button>
      <button class="plate sm" id="reveal-all" type="button" hidden>全部揭示</button>
      <button class="plate sm" id="restart" type="button" hidden>重新抽牌</button>
      <button class="plate sm icon" id="sound" type="button" aria-pressed="true" aria-label="关闭音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" fill-opacity=".15"/>
          <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6"/>
          <path class="wave w2" d="M18 6.5a7.8 7.8 0 0 1 0 11"/>
          <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <button class="plate sm icon" id="settings-btn" type="button" aria-label="设置" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>
          <circle cx="12" cy="12" r="6.4" stroke-dasharray="2 2.2"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="settings" role="dialog" aria-label="设置" hidden>
    <div class="st-head"><i class="rule"></i><b>设 置</b></div>
    <div class="st-group">占 卜</div>
    <label class="st-row"><span><b>一键占卜</b><small>自动洗牌、抽牌并依次揭示</small></span><input type="checkbox" data-k="autoDraw"><i class="sw"></i></label>
    <label class="st-row"><span><b>自动翻牌</b><small>选完牌后自动揭示</small></span><input type="checkbox" data-k="autoReveal"><i class="sw"></i></label>
    <label class="st-row"><span><b>跳过洗牌动画</b><small>直接进入选牌</small></span><input type="checkbox" data-k="skipIntro"><i class="sw"></i></label>
    <label class="st-row"><span><b>逆位</b><small>允许抽到逆位牌</small></span><input type="checkbox" data-k="reversed"><i class="sw"></i></label>
    <div class="st-group">表 现</div>
    <label class="st-row"><span><b>视差 / 陀螺仪</b><small>悬停或倾斜手机时的纵深</small></span><input type="checkbox" data-k="parallax"><i class="sw"></i></label>
    <label class="st-row"><span><b>弱化动效</b><small>更快、更少闪光与震动</small></span><input type="checkbox" data-k="calm"><i class="sw"></i></label>
    <label class="st-row"><span><b>音效</b><small>洗牌、翻牌等仪式音效</small></span><input type="checkbox" data-k="sound"><i class="sw"></i></label>
    <label class="st-row"><span><b>背景音</b><small>低沉的环境长音</small></span><input type="checkbox" data-k="ambient"><i class="sw"></i></label>
  </div>

  <section id="intro">
    <div class="hero-wrap"><div class="hero-card" id="hero-card"></div><i class="hero-shadow" aria-hidden="true"></i></div>
    <p class="eyebrow">NAIWA&nbsp;·&nbsp;GOTHIC&nbsp;·&nbsp;TAROT</p>
    <h1 class="title"><span class="t1">奶蛙的</span><span class="t2">暗黑命运</span></h1>
    <i class="rule title-rule" aria-hidden="true"></i>
    <p class="lede">一只始终面无表情的黄色梨形怪物，<br />穿行于庄严、阴郁、华丽的哥特塔罗世界。</p>
    <label class="question plate">
      <input id="question" type="text" maxlength="60" autocomplete="off" placeholder="在心中默念你的问题……（可不填）" />
    </label>
    <div class="spreads" id="spreads"></div>
    <label class="auto-toggle"><input type="checkbox" data-k="autoDraw"><i class="sw"></i><span>一键占卜 · 自动抽牌并揭示</span></label>
  </section>

  <div id="stage" aria-live="polite"></div>
  <div id="flash" aria-hidden="true"></div>

  <aside id="reading" aria-label="解读" hidden>
    <div class="reading-inner" id="reading-inner"></div>
  </aside>

  <div id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-body">
      <div class="modal-card" id="modal-card"></div>
      <div class="modal-text" id="modal-text"></div>
      <button class="modal-close plate sm icon" type="button" data-close aria-label="关闭">✕</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
